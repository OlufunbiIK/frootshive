<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#123f27" />
    <title>Frootshive · Customer Experience Form</title>
    <meta
      name="description"
      content="Tell us about your Frootshive experience and join the Hive. Takes about 3 minutes, mostly tap-to-answer."
    />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link preview (WhatsApp, Facebook, LinkedIn, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Frootshive" />
    <meta
      property="og:title"
      content="Welcome to the Hive · Frootshive Customer Experience Form"
    />
    <meta
      property="og:description"
      content="Freshness you can taste, nature you can trust. Share your experience with us in about 3 minutes."
    />
    <meta property="og:url" content="https://frootshive-form.vercel.app/" />
    <meta
      property="og:image"
      content="https://frootshive-form.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Frootshive logo" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Welcome to the Hive · Frootshive Customer Experience Form"
    />
    <meta
      name="twitter:description"
      content="Freshness you can taste, nature you can trust. Share your experience with us in about 3 minutes."
    />
    <meta
      name="twitter:image"
      content="https://frootshive-form.vercel.app/og-image.png"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond..."
      rel="stylesheet"
    />
  </head>
  <body class="intro">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
